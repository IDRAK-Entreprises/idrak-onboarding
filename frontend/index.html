<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IDRAK Order Queue</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background: #f4f4f4; }
    button { padding: 8px 16px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #0056b3; }
    .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .pending { background: #fff3cd; }
    .completed { background: #d4edda; }
  </style>
</head>
<body>
  <div id="app">
    <h1>IDRAK Order Queue</h1>
    <button @click="fulfillNext" style="margin-bottom: 20px;">Fulfill Next Order</button>
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Status</th>
          <th>Created At</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="order in orders" :key="order.id">
          <td>{{ order.id }}</td>
          <td>{{ order.customer_name }}</td>
          <td><span class="status" :class="order.status">{{ order.status }}</span></td>
          <td>{{ new Date(order.created_at).toLocaleString() }}</td>
        </tr>
      </tbody>
    </table>
    <p v-if="orders.length === 0">No orders found.</p>
    <p v-if="message" style="color: green;">{{ message }}</p>
  </div>

  <script>
    const { createApp } = Vue

    createApp({
      data() {
        return {
          orders: [],
          message: ''
        }
      },
      mounted() {
        this.fetchOrders()
      },
      methods: {
        async fetchOrders() {
          const res = await fetch('http://localhost:8000/orders')
          this.orders = await res.json()
        },
        async fulfillNext() {
          const res = await fetch('http://localhost:8000/orders/queue')
          if (!res.ok) {
            this.message = 'No pending orders in queue'
            return
          }
          const order = await res.json()
          await fetch(`http://localhost:8000/orders/${order.id}/fulfill?worker_id=1`, {
            method: 'POST'
          })
          this.message = `Order #${order.id} fulfilled!`
          this.fetchOrders()
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
